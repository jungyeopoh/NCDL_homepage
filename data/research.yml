overview:
  title: "Hardware for AI, from the materials up"
  description: >-
    AI is outgrowing the hardware that runs it. In von Neumann computers,
    moving data between processor and memory now costs more time and energy
    than computing on it: the memory wall. NCDL attacks this wall from the
    bottom up, with new materials and processes, next-generation memory
    devices modeled from physics to circuits, and neuromorphic hardware that
    we evaluate on real AI models.
  diagram:
    image: "diagrams/research-stack.svg"
    caption: "Three connected layers of research, tied together by modeling and simulation."

# 디자인 b 버전(site.yml design.version: "b" 또는 주소 뒤 ?design=b)에서 쓰는 소개. AI와 파급 효과를 강조.
overview_b:
  title: "Semiconductor technology for AI"
  description: >-
    AI models keep growing, and the hardware that runs them is struggling to
    keep up. The limit is no longer arithmetic but memory: storing billions of
    weights and moving them between memory and processor now dominates the
    time and energy of AI. NCDL works on this problem across the full stack,
    from new materials and processes to next-generation memory devices and
    neuromorphic hardware, and tests what it builds on real AI models. The
    goal is AI that needs far less energy and can run anywhere, from data
    centers to small devices.
  diagram:
    image: "diagrams/ai-overview.svg"
    caption: "What AI needs, what we build for it, and what that makes possible."

topics:
  - id: neuromorphic
    icon: spikes
    title: "Neuromorphic Computing"
    title_ko: "뉴로모픽 컴퓨팅"
    summary: "Artificial synapses and neurons, built into arrays and judged by how real neural networks perform on them."
    description: >-
      Neuromorphic hardware computes where data are stored, the way synapses
      do in the brain. We build artificial synapses and neurons from
      next-generation memory devices, fabricate them into arrays, and measure
      them. What sets our work apart is the next step: we run state-of-the-art
      neural networks, from generative adversarial networks to Transformers,
      on our measured device data and evaluate accuracy and power at the
      system level.
    diagram:
      image: "diagrams/neuromorphic-flow.svg"
      caption: "From devices to network-level evaluation. Steps 3 to 5 are where our lab concentrates."
    figures:
      - image: "gan-hardware.webp"
        caption: "A stochastic memristor array drives a generative network that synthesizes chest X-ray images."
        paper: 14
      - image: "dnn-hardware.webp"
        caption: "General-purpose DNN hardware: a synaptic crossbar paired with memristive ReLU neurons."
        paper: 11

  - id: memory
    icon: hysteresis
    title: "Next-generation Memory Devices"
    title_ko: "차세대 메모리 소자"
    summary: "New memories that reinforce the hierarchy beyond DRAM and NAND, modeled from physics to circuits."
    description: >-
      The SRAM, DRAM, and NAND hierarchy leaves gaps in speed, density, and
      energy, and the rise of HBM shows how much value lies in rethinking it.
      We develop memories beyond DRAM and NAND, including RRAM,
      transistor-based memories, oxide- and 2D-channel devices, and 2T DRAM,
      that can be built in monolithic 3D. Every device we make is modeled
      across a full simulation hierarchy: Monte Carlo physics-based models
      matched to behavioral models, carried into circuit simulation and
      design, and linked with TCAD and DFT.
    diagram:
      image: "diagrams/memory.svg"
      caption: "Where our memories fit in the hierarchy, and how we model them."
    figures:
      - image: "hbn-3d-memristor.webp"
        caption: "Three-floor vertically stacked hBN memristor arrays fabricated at wafer scale."
        paper: 16
      - image: "cu-imidazole-memristor.webp"
        caption: "Copper–imidazole interaction creates many weak filaments for a highly reliable memristor."
        paper: 7
      - image: "charge-trap-decay.webp"
        caption: "Band-engineered charge-trap stack with tunable spontaneous decay."
        paper: 20

  - id: process
    icon: layers
    title: "Advanced Semiconductor Process"
    title_ko: "첨단 반도체 공정"
    summary: "Growing next-generation materials, engineering their interfaces, and stacking them on silicon in M3D."
    description: >-
      New devices need new materials that fit into silicon manufacturing. We
      grow and synthesize 2D and oxide semiconductor films such as MoS2,
      Bi2O2Se, and IGZO, engineer their interfaces with metal-oxide
      dielectrics and metal contacts, and integrate the resulting devices on
      top of silicon through low-temperature monolithic 3D processes. Next, we
      will couple this process development with simulation.
    diagram:
      image: "diagrams/process-m3d.svg"
      caption: "New-material devices stacked above silicon CMOS, and the process steps we develop."
    figures:
      - image: "bi2o2se-synthesis.webp"
        caption: "Low-temperature solution synthesis of Bi2O2Se on an Al-patterned substrate, with elemental mapping."
        paper: 17
      - image: "mos2-egt.webp"
        caption: "MoS2 transistor on a tunable organic–inorganic hybrid AlOx dielectric."
        paper: 15
