# ─────────────────────────────────────────────
#  연구실 지원 안내 (Join us 페이지)
#  - 지원 조건·처우는 실제 연구실 상황에 맞게 꼭 확인·수정하세요.
# ─────────────────────────────────────────────

lead: >-
  NCDL은 차세대 AI 반도체를 함께 만들어 갈 대학원생과 학부연구생을 모집합니다.
  소자 설계부터 공정, 측정, 뉴로모픽 시스템 구현까지 반도체 연구의 전 과정을
  직접 경험할 수 있습니다.

lead_en: >-
  We welcome motivated students who want to build next-generation AI
  semiconductors. Members take part in the full research cycle, from device
  design and fabrication to measurement and neuromorphic system demonstration.

positions:
  - title: "석사과정 (M.S.)"
    text: "반도체 소자·공정 연구를 처음 시작하는 학생에게 적합합니다."
  - title: "박사과정 · 석박통합과정 (Ph.D. / Integrated M.S.–Ph.D.)"
    text: "독립적인 연구자로 성장하고 싶은 학생. 장기 연구 주제를 주도적으로 수행합니다."
  - title: "학부연구생 (Undergraduate intern)"
    text: "학기 중 또는 방학 기간에 연구에 참여합니다. 대학원 진학 전 연구실 생활을 경험할 수 있습니다."

looking_for:
  - "전자공학, 재료공학, 물리학, 화학 및 관련 전공자 (전공 무관, 의지가 가장 중요합니다)"
  - "반도체 소자, 메모리, 뉴로모픽 컴퓨팅, AI 하드웨어에 관심이 있는 학생"
  - "직접 만들고 측정하며 문제를 끝까지 파고드는 것을 즐기는 학생"

we_offer:
  - "연구 참여에 따른 인건비 및 장학금 지원 (세부 기준은 면담 시 안내)"
  - "국내외 학회 발표 및 공동연구 참여 기회"
  - "소자 제작부터 측정·분석까지 반도체 연구 전 과정 경험"
  - "교수와의 정기적인 1:1 미팅을 통한 연구 지도"

how_to_apply:
  - "아래 서류를 준비해 이메일로 보내 주세요: 이력서(CV), 성적증명서, 간단한 자기소개 및 관심 연구 분야 (자유 양식)"
  - "메일 제목: [NCDL 지원] 이름_지원과정 (예: [NCDL 지원] 홍길동_석사과정)"
  - "서류 검토 후 개별 면담 일정을 안내드립니다."

faq:
  - q: "학부 전공이 전자공학이 아니어도 지원할 수 있나요?"
    a: "네. 재료, 물리, 화학 등 다양한 배경의 학생을 환영합니다. 필요한 지식은 연구실에서 함께 공부합니다."
  - q: "지원 전에 면담이나 연구실 방문이 가능한가요?"
    a: "가능합니다. 이메일로 편한 일정을 알려 주시면 면담 시간을 잡아 드립니다."
  - q: "학부연구생은 언제부터 참여할 수 있나요?"
    a: "학기 중, 방학 중 언제든 지원할 수 있습니다. 가급적 한 학기 이상 꾸준히 참여하는 것을 권장합니다."
