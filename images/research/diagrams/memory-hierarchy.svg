<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" role="img" aria-label="Memory hierarchy and where NCDL's next-generation memories fit"><title>Memory hierarchy and where NCDL's next-generation memories fit</title><style>
  .t  { font-family: var(--font-body, 'Pretendard', 'Apple SD Gothic Neo', Arial, sans-serif); fill: #17212c; }
  .h  { font-family: var(--font-display, Arial, sans-serif); font-weight: 700; fill: #17212c; }
  .m  { fill: #56626f; }
  .w  { fill: #fff; }
  .b  { fill: #0062a8; }
  .n  { fill: #053863; }
  .sm { font-size: 13px; }
  .md { font-size: 15px; }
  .lg { font-size: 18px; }
  .xl { font-size: 22px; }
  .bold { font-weight: 650; }
  .ln { stroke: #56626f; stroke-width: 1.4; fill: none; }
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#56626f"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0062a8"/></marker><linearGradient id="film" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b5844a"/><stop offset=".35" stop-color="#7b4fa6"/><stop offset=".65" stop-color="#0062a8"/><stop offset="1" stop-color="#2a9a96"/></linearGradient></defs><polygon points="280,40 340,40 380,110 240,110" fill="#053863"/><text x="310" y="77.0" class="t md bold w" text-anchor="middle" >SRAM</text><text x="310" y="96.0" class="t sm w" text-anchor="middle" opacity=".85">cache</text><polygon points="210,144 410,144 450,214 170,214" fill="#0a4a80"/><text x="310" y="181.0" class="t md bold w" text-anchor="middle" >DRAM / HBM</text><text x="310" y="200.0" class="t sm w" text-anchor="middle" opacity=".85">main memory</text><polygon points="140,248 480,248 520,318 100,318" fill="#0062a8"/><text x="310" y="285.0" class="t md bold w" text-anchor="middle" >NAND flash</text><text x="310" y="304.0" class="t sm w" text-anchor="middle" opacity=".85">storage</text><polygon points="80,352 540,352 580,422 40,422" fill="#5b8fc4"/><text x="310" y="389.0" class="t md bold w" text-anchor="middle" >HDD</text><text x="310" y="408.0" class="t sm w" text-anchor="middle" opacity=".85">archive</text><rect x="140" y="121.0" width="340" height="12" rx="6" fill="#2a9a96"/><path d="M486,127.0 L600,127.0" stroke="#2a9a96" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="600" cy="127.0" r="4" fill="#2a9a96"/><text x="615" y="119.0" class="h lg" text-anchor="start" style="fill:#2a9a96">On-chip, M3D memory</text><text x="615" y="143.0" class="t md" text-anchor="start" >2T (capacitor-less) DRAM</text><text x="615" y="162.0" class="t md" text-anchor="start" >oxide- and 2D-channel memory transistors</text><rect x="140" y="225.0" width="340" height="12" rx="6" fill="#7b4fa6"/><path d="M486,231.0 L600,231.0" stroke="#7b4fa6" stroke-width="1.6" stroke-dasharray="4 3"/><circle cx="600" cy="231.0" r="4" fill="#7b4fa6"/><text x="615" y="223.0" class="h lg" text-anchor="start" style="fill:#7b4fa6">Storage-class memory</text><text x="615" y="247.0" class="t md" text-anchor="start" >RRAM</text><text x="615" y="266.0" class="t md" text-anchor="start" >transistor-based non-volatile memory</text><path d="M20,440 L20,50" stroke="#56626f" stroke-width="1.4" marker-end="url(#arr)"/><text x="34" y="60" class="t sm m" text-anchor="start" >faster</text><text x="34" y="438" class="t sm m" text-anchor="start" >denser, cheaper per bit</text><text x="615" y="330" class="t md bold" text-anchor="start" >Goal: reinforce the hierarchy</text><text x="615" y="352" class="t md m" text-anchor="start" >where DRAM and NAND fall short</text></svg>