# 논문 추가/상태 변경 이슈와 새 논문 후보 댓글(/approve, /ignore)을 처리합니다.
name: Publications bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: pubbot
  cancel-in-progress: false

jobs:
  bot:
    # 저장소 주인(교수님)이 올린 것만 처리
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' &&
          (contains(github.event.issue.labels.*.name, 'add-paper') || contains(github.event.issue.labels.*.name, 'update-paper'))) ||
        (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/') &&
          (contains(github.event.issue.labels.*.name, 'paper-candidates') ||
           contains(github.event.issue.labels.*.name, 'add-paper') ||
           contains(github.event.issue.labels.*.name, 'update-paper')))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruamel.yaml>=0.18,<0.20"
      - name: Process
        id: bot
        run: |
          set +e
          python scripts/pubbot.py event "$GITHUB_EVENT_PATH"
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.bot.outputs.code == '0'
        run: |
          git config user.name "ncdl-pubbot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data .github/pubbot-ignore.txt 2>/dev/null || git add data
          git diff --cached --quiet || git commit -m "$(cat .pubbot_commit_msg)" -m "via issue #${{ github.event.issue.number }}"
          git push
      - name: Reply
        if: steps.bot.outputs.code == '0' || steps.bot.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file .pubbot_comment.md
          if [ "${{ steps.bot.outputs.code }}" = "0" ]; then gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"; fi
