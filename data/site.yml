design:
  # 디자인 버전: a (크로스바 어레이) / b (어레이 + 신경망, AI 강조).
  # 다른 버전을 미리 보려면 홈페이지 주소 뒤에 ?design=a 를 붙여 보세요 (그 브라우저에서만 보임).
  version: "b"
  # 본문 바탕: paper (밝은 회녹색) / white (흰 바탕) / navy (메뉴까지 남색). 홈 첫 화면은 항상 남색
  theme: "paper"
  # 로고 파일 (images/ 폴더에 올리고 파일명 입력, 예: logo.svg 또는 logo.png). 비우면 기본 마크
  logo: "brand/ncdl-logo.png"
  # 어두운 배경(navy 테마)에서 쓸 흰색 로고
  logo_on_dark: "brand/ncdl-logo-white.png"
  # 학교 심볼 (헤더 로고 옆, 하단에 표시). 비우면 표시 안 함
  university_logo: "brand/cau-symbol.png"
  university_logo_on_dark: "brand/cau-symbol-white.png"
  # 홈 첫 화면 배경 사진 (images/ 폴더, 예: hero.jpg). 넣으면 크로스바 어레이 그림 대신 사진이 깔립니다
  hero_image: ""

# 홈 화면 첫 문장
tagline: "We build memory devices and circuits that compute the way the brain does."
intro: >-
  NCDL develops next-generation AI semiconductor technology: low-dimensional
  materials for angstrom-scale semiconductors, emerging non-volatile memories,
  and neuromorphic hardware that overcomes the memory wall of conventional
  von Neumann computers.

# 디자인 b 버전에서 쓰는 홈 화면 문구 (비우면 위 tagline / intro 사용)
tagline_b: "Semiconductor technology for AI, from atoms to neural networks."
intro_b: >-
  NCDL builds the hardware that AI runs on: next-generation materials and
  processes, memory devices beyond DRAM and NAND, and neuromorphic chips. We
  test what we build on real AI models, from generative networks to
  Transformers.

# 모집 공고 (홈 화면 띠 배너). 모집하지 않을 때는 recruiting: false
recruiting: true
