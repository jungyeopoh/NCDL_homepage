#  연구실 지원 안내 (Join us 페이지)
#  - 지원 조건·처우는 실제 연구실 상황에 맞게 꼭 확인·수정하세요.
# ─────────────────────────────────────────────

lead: >-
  NCDL은 차세대 AI 반도체를 함께 만들어 갈 석사·박사·석박통합과정 대학원생을
  모집합니다. 소자 제작부터 측정, 모델링, 뉴로모픽 시스템 평가까지 넓은 범위의
  연구를 다루며, 연구 전 과정에서 AI를 적극적으로 활용합니다.

lead_en: >-
  We are recruiting M.S., Ph.D., and integrated M.S.–Ph.D. students. Our work
  spans device fabrication, measurement, modeling, and neuromorphic system
  evaluation, and we use AI tools heavily at every step.

positions:
  - title: "석사과정 (M.S.)"
    text: "반도체 소자·공정 연구를 처음 시작하는 학생에게 적합합니다."
  - title: "박사과정 · 석박통합과정 (Ph.D. / Integrated M.S.–Ph.D.)"
    text: "독립적인 연구자로 성장하고 싶은 학생. 장기 연구 주제를 주도적으로 수행합니다."
  - title: "학부 인턴"
    text: "별도로 모집하지 않습니다. 다만 대학원 진학을 희망하는 중앙대학교 재학생은 면담을 통해 인턴 참여를 고려할 수 있습니다."

looking_for:
  - "전자공학 및 관련 전공자로, 반도체 소자와 메모리 소자에 관심이 있는 학생"
  - "넓은 범위의 일을 다루기 위해 많은 지식과 다양한 툴을 빠르게 배우고 익히는 학생"
  - "AI를 적극적으로 활용해 많은 지식을 습득하고 많은 양의 일을 해내는 학생"
  - "맡은 과업을 열정적으로 수행하는 학생"

we_offer:
  - "인건비 및 장학금 지원 (세부 기준은 면담 시 안내)"
  - "소자 제작부터 측정·분석까지 반도체 연구 전 과정 경험"
  - "AI를 연구 전 과정에 적극적으로 활용하는 환경: AI로 훨씬 많은 양의 일을 다루는 방법을 익힙니다"

how_to_apply:
  - "아래 서류를 준비해 이메일로 보내 주세요: 이력서(CV), 성적증명서, 간단한 자기소개 및 관심 연구 분야 (자유 양식)"
  - "메일 제목: [NCDL 지원] 이름_지원과정 (예: [NCDL 지원] 홍길동_석사과정)"
  - "서류 검토 후 개별 면담 일정을 안내드립니다."

faq:
  - q: "학부 전공이 전자공학이 아니어도 지원할 수 있나요?"
    a: "관련 전공이면 지원할 수 있습니다. 전공보다 넓은 범위의 지식과 툴을 빠르게 배우려는 의지가 더 중요합니다."
  - q: "지원 전에 면담이나 연구실 방문이 가능한가요?"
    a: "가능합니다. 이메일로 편한 일정을 알려 주시면 면담 시간을 잡아 드립니다."
  - q: "학부 인턴도 모집하나요?"
    a: "학부 인턴은 별도로 모집하지 않습니다. 대학원 진학을 희망하는 중앙대학교 재학생은 면담을 통해 인턴 참여를 고려할 수 있으니 이메일로 문의해 주세요."
