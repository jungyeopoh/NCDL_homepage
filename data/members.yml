professor:
  name: "Jungyeop Oh"
  name_ko: "오정엽"
  title: "Assistant Professor"
  affiliation: "School of Integrative Engineering, Chung-Ang University"
  photo: ""              # 예: jungyeop-oh.jpg
  email: "jungyeopoh@cau.ac.kr"
  phone: "+82-2-820-5559"
  office: "Room 903, Building 305"
  bio: >-
    Jungyeop Oh is an Assistant Professor in the School of Integrative
    Engineering at Chung-Ang University. He received his Ph.D. in Electrical
    Engineering from KAIST in 2024, where he worked on memristive synapses,
    artificial neurons, and reservoir computing hardware built on
    two-dimensional and organic–inorganic hybrid materials. Before joining
    Chung-Ang University in 2025, he was a Research Staff Member at the Samsung
    Advanced Institute of Technology. His research spans neuromorphic
    computing, next-generation memory devices, and advanced semiconductor
    processes.
  education:
    - years: "2018 – 2024"
      text: "Ph.D. in Electrical Engineering, KAIST"
    - years: "2014 – 2018"
